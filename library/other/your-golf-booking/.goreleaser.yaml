version: 2
project_name: your-golf-booking-pp-cli
changelog:
  disable: true
builds:
  - id: your-golf-booking-pp-cli
    main: ./cmd/your-golf-booking-pp-cli
    binary: your-golf-booking-pp-cli
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
brews:
  - name: your-golf-booking-pp-cli
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Read public Your Golf Booking and TrackMan bay occupancy, open slots, and list prices for one venue at a time."
    install: |
      bin.install "your-golf-booking-pp-cli"
